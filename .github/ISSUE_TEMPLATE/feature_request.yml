name: Feature request
description: Suggest a focused improvement to ApplyFlow.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What workflow is difficult today, and who experiences it?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Share any workarounds or other approaches you considered.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This request is related to job-search organization or application tracking.
          required: true
